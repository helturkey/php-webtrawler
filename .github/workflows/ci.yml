
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    env:
      COMPOSER_ROOT_VERSION: '0.4.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, iconv, intl, mbstring, pdo_sqlite, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      # This is a Composer library, so composer.lock is generated for CI
      # instead of being committed as an application lock file.
      - name: Resolve dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: PHP CS Fixer
        run: composer cs

      - name: PHPStan
        run: composer stan

      - name: PHPUnit
        run: composer test

      - name: Laravel integration tests
        run: composer test-laravel

  browser-integration:
    name: Chromium / Isolated Network
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build browser integration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.browser-ci
          tags: php-scraper-browser-ci:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This flag is passed only when Docker actually disables
      # external networking. Never bake it into the Docker image.
      - name: Run Chromium tests in an isolated network namespace
        run: |
          docker run --rm --init \
            --network none \
            --shm-size=1g \
            --security-opt seccomp=unconfined \
            --env SCRAPER_BROWSER_EGRESS_ISOLATED=1 \
            php-scraper-browser-ci:ci